<!-- Drawn into a picture at build time: the boot screen has no fonts to rely on. -->
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="460" height="60" viewBox="0 0 460 60">
  <text x="230" y="23" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="18" fill="#8a8f98">Ctrl + Alt + F  ·  full screen</text>
  <text x="230" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="18" fill="#8a8f98">Ctrl + Alt + Backspace  ·  help, if it gets stuck</text>
</svg>
