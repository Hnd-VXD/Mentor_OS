# Mentor: OpenSnitch's daemon writes only warnings and errors to its log. Its usual level writes a line for every
# answer Mentor's guard gives (mentor-netguard), and nothing rotates the log here (no logrotate). SECURITY.md.
# It finds its interface, Mentor's guard, in a folder only root can enter, not at /tmp/osui.sock, where any program
# could take the name while the guard restarts (review of 2026-11-14). The guard writes the same address into
# /etc/opensnitchd/default-config.json (Server.Address), so it holds whichever of the two the daemon reads.
[Service]
ExecStart=
ExecStart=/usr/bin/opensnitchd -rules-path /etc/opensnitchd/rules -ui-socket unix:///run/mentor-netguard-ui/osui.sock -warning
