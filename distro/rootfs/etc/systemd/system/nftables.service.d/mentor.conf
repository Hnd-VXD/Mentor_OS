# The firewall's service as Mentor needs it: it counts as running while its rules are
# loaded (so that "is it on?" has an answer), stopping it takes the rules away, and
# reloading reads /etc/nftables.conf and /etc/nftables.d/ again. See /etc/mentor/SECURITY.md.
[Service]
RemainAfterExit=yes
ExecReload=/usr/bin/nft -f /etc/nftables.conf
ExecStop=/usr/bin/nft flush ruleset
