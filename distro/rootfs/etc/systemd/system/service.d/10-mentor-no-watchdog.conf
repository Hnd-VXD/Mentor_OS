# Mentor runs in a VM, and Windows pauses the VM while it sleeps. On waking, a service that has
# not said "alive" for longer than its watchdog (3 minutes for journald, logind, udevd, hostnamed)
# was killed as hung: on 2026-10-14 a sleep of 88 minutes killed logind, and the desktop lost its
# screen and keyboard. A pause is not a hang, so no service of the system is watched this way.
# See /etc/mentor/BOOT.md, "When Windows sleeps".
[Service]
WatchdogSec=0
