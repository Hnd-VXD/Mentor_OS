# Mentor: the disk is told what has been deleted (fstrim) a quarter of an hour after every start as
# well, not only once a week. In a Mentor that runs on Windows that is what lets the room of deleted
# files be used again inside the disk file there, so that file stops growing; on a Mentor on its own
# PC it is the usual care for an SSD. etc/mentor/DESKTOP.md, "Disk space".
# The timer as it comes waits up to 100 minutes more at random and is exact to the hour only, which is
# for many PCs sharing one disk system; here it would put the run after most sessions have ended.
[Timer]
OnBootSec=15min
RandomizedDelaySec=0
AccuracySec=1min
