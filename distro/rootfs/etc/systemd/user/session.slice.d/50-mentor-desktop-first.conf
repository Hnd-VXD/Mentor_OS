# The desktop comes first (/etc/mentor/FREEZES.md, stage 1): GNOME Shell and the rest of the
# session get ten times the processor share of apps (app.slice keeps the default 100), so a
# program busy with something heavy slows itself, not the screen. Mentor's assistant, the
# desktop window itself, raises its own share among the apps (mentor-chat, desktop_first).
[Slice]
CPUWeight=1000
