# Mentor: a program that does not stop at shutdown or restart is stopped by force after 30 seconds, not 90.
# Once, right after systemd itself was upgraded, the screen stayed black 85 seconds while shutdown waited on
# one; the user chose 30 over GNOME's 90 and over 15 (2026-10-19). Updates are installed before shutdown,
# so they are not cut. etc/mentor/DESKTOP.md, "Shutdown".
[Manager]
DefaultTimeoutStopSec=30s
