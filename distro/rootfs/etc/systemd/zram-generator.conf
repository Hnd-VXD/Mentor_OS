# Compressed memory (zram-generator, package zram-generator): a swap device in RAM itself. When memory runs
# short, what has not been touched for a while is compressed (zstd, about a third of its size) instead of a
# program being closed. Half of the memory, at most 8 GB. etc/mentor/DESKTOP.md, "Memory".
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
