# For swap in compressed RAM (etc/systemd/zram-generator.conf): moving a page there is cheap, so the
# kernel may do it early (swappiness above 100), and one page at a time (no read-ahead). The values
# Fedora and the zram-generator documentation use. etc/mentor/DESKTOP.md, "Memory".
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
