# Mentor: programs that play through ALSA itself go to PipeWire's PulseAudio server (alsa-plugins),
# and to the sound card directly when no such server is running (a text console, root, repair mode).
#
# Not pipewire-alsa's route: with PipeWire 1.6.10 (not 1.6.9) its aplay played the sound and then
# never exited, deaf to SIGTERM, unless given an explicit period size (tested 2026-10-29). This
# file sorts after pipewire-alsa's 99-pipewire-default.conf, so it still wins if that package is
# installed. See /etc/mentor/WINDOWS.md, section 5.

pcm.!default {
    type pulse
    fallback "sysdefault"
    hint {
        show on
        description "Default ALSA Output (PipeWire, through its PulseAudio server)"
    }
}

ctl.!default {
    type pulse
    fallback "sysdefault"
}
