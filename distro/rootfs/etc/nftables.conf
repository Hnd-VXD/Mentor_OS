#!/usr/bin/nft -f
# Mentor's firewall: other computers cannot start a connection to this one.
# What this computer starts itself (the web, updates, the models) is answered as usual.
# Loaded at start-up by nftables.service. See /etc/mentor/SECURITY.md.
#
# Do not open a port here. A port is opened by a file of its own in /etc/nftables.d/
# (the example there says how), so that this file stays as it was built.

flush ruleset

table inet mentor_firewall {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept comment "answers to what this computer asked for"
        ct state invalid drop
        iif "lo" accept comment "programs here talking to each other"
        meta l4proto { icmp, ipv6-icmp } accept comment "ping, and what IPv6 needs to work at all"
        udp dport 546 accept comment "an IPv6 address from the network (DHCPv6)"

        # What is refused from here on. The network's own chatter (printers and phones
        # announcing themselves to everybody) is dropped without a word; an attempt aimed at
        # this computer is written to the kernel's log, a few a minute at most, for the user
        # to hear of and the assistant to look at (mentor_security.refused, SECURITY.md).
        meta pkttype { broadcast, multicast } drop
        limit rate 6/minute burst 10 packets log prefix "mentor-firewall refused: "
    }
}

include "/etc/nftables.d/*.nft"
